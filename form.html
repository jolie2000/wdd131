<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form | WDD 131</title>
    <meta
      name="description"
      content="WDD 131 product review form with dynamic product options, required fields, and a review confirmation counter."
    >
    <meta name="author" content="Uwase Jolie">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles/form.css">
    <script defer src="scripts/getdates.js"></script>
    <script defer src="scripts/form.js"></script>
  </head>
  <body>
    <header>
      <span class="site-title">Product Review</span>
    </header>

    <main>
      <h1>Product Review Form</h1>
      <form method="get" action="review.html">
        <p class="required-note"><span aria-hidden="true">*</span> Required fields</p>

        <label for="product">
          Product Name <span aria-hidden="true">*</span>
        </label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>

        <fieldset>
          <legend>Overall Rating <span aria-hidden="true">*</span></legend>
          <div class="rating-group">
            <label for="rating1">
              <input type="radio" id="rating1" name="rating" value="1" required>
              <span class="visually-hidden">1 star</span>
              <span>&star;</span>
            </label>
            <label for="rating2">
              <input type="radio" id="rating2" name="rating" value="2" required>
              <span class="visually-hidden">2 stars</span>
              <span>&star;&star;</span>
            </label>
            <label for="rating3">
              <input type="radio" id="rating3" name="rating" value="3" required>
              <span class="visually-hidden">3 stars</span>
              <span>&star;&star;&star;</span>
            </label>
            <label for="rating4">
              <input type="radio" id="rating4" name="rating" value="4" required>
              <span class="visually-hidden">4 stars</span>
              <span>&star;&star;&star;&star;</span>
            </label>
            <label for="rating5">
              <input type="radio" id="rating5" name="rating" value="5" required>
              <span class="visually-hidden">5 stars</span>
              <span>&star;&star;&star;&star;&star;</span>
            </label>
          </div>
        </fieldset>

        <label for="installDate">
          Date of Installation <span aria-hidden="true">*</span>
        </label>
        <input type="date" id="installDate" name="installDate" required>

        <fieldset>
          <legend>Useful Features</legend>
          <div class="checkbox-group">
            <label for="durability">
              <input
                type="checkbox"
                id="durability"
                name="features"
                value="durability"
              >
              Durability
            </label>
            <label for="easeOfUse">
              <input
                type="checkbox"
                id="easeOfUse"
                name="features"
                value="ease-of-use"
              >
              Ease of Use
            </label>
            <label for="performance">
              <input
                type="checkbox"
                id="performance"
                name="features"
                value="performance"
              >
              Performance
            </label>
            <label for="design">
              <input type="checkbox" id="design" name="features" value="design">
              Design
            </label>
          </div>
        </fieldset>

        <label for="review">Written Review</label>
        <textarea
          id="review"
          name="review"
          rows="5"
          placeholder="Share what worked well or what could be improved."
        ></textarea>

        <label for="userName">User Name</label>
        <input type="text" id="userName" name="userName" autocomplete="name">

        <input type="submit" value="Submit Review">
      </form>
    </main>

    <footer>
      <p>&copy; <span id="currentyear"></span> Uwase Jolie. UGANDA.</p>
      <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
  </body>
</html>
