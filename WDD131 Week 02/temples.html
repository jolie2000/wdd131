<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Temple Album — a responsive, accessible gallery of historic temples."
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <title>Temple Album</title>
    <link rel="stylesheet" href="styles/temples.css" />
    <link rel="stylesheet" href="styles/temples-large.css" />
  </head>
  <body>
    <a class="skip-link" href="#mainContent">Skip to main content</a>
    <header class="site-header">
      <div class="container header-inner">
        <h2 class="site-title">Temple Album</h2>

        <button
          id="navToggle"
          class="nav-toggle"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Open navigation"
        >
          <svg
            class="icon icon-hamburger"
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M3 6h18M3 12h18M3 18h18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <nav id="mainNav" class="main-nav" aria-label="Primary navigation">
          <ul class="nav-list">
            <li><a href="#">Home</a></li>
            <li><a href="#">Old</a></li>
            <li><a href="#">New</a></li>
            <li><a href="#">Large</a></li>
            <li><a href="#">Small</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="mainContent" class="container main-content">
      <h1>Historic Temples Gallery</h1>

      <section class="gallery" aria-label="Temple images">
        <!-- 9 figures with responsive webp images and meaningful alt text -->
        <figure>
          <picture>
            <source
              type="image/webp"
              srcset="
                https://picsum.photos/id/1015/800/600.webp   800w,
                https://picsum.photos/id/1015/1200/900.webp 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
            />
            <img
              src="https://picsum.photos/id/1015/800/600.jpg"
              srcset="
                https://picsum.photos/id/1015/800/600.jpg   800w,
                https://picsum.photos/id/1015/1200/900.jpg 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
              alt="Stone temple beside a misty lake at sunrise"
              loading="lazy"
            />
          </picture>
          <figcaption>Temple beside a misty lake</figcaption>
        </figure>

        <figure>
          <picture>
            <source
              type="image/webp"
              srcset="
                https://picsum.photos/id/1025/800/600.webp   800w,
                https://picsum.photos/id/1025/1200/900.webp 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
            />
            <img
              src="https://picsum.photos/id/1025/800/600.jpg"
              srcset="
                https://picsum.photos/id/1025/800/600.jpg   800w,
                https://picsum.photos/id/1025/1200/900.jpg 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
              alt="Ancient stone steps leading to a temple doorway"
              loading="lazy"
            />
          </picture>
          <figcaption>Ancient stone steps</figcaption>
        </figure>

        <figure>
          <picture>
            <source
              type="image/webp"
              srcset="
                https://picsum.photos/id/1035/800/600.webp   800w,
                https://picsum.photos/id/1035/1200/900.webp 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
            />
            <img
              src="https://picsum.photos/id/1035/800/600.jpg"
              srcset="
                https://picsum.photos/id/1035/800/600.jpg   800w,
                https://picsum.photos/id/1035/1200/900.jpg 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
              alt="Ornate temple roof against a blue sky"
              loading="lazy"
            />
          </picture>
          <figcaption>Ornate temple roof</figcaption>
        </figure>

        <figure>
          <picture>
            <source
              type="image/webp"
              srcset="
                https://picsum.photos/id/1045/800/600.webp   800w,
                https://picsum.photos/id/1045/1200/900.webp 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
            />
            <img
              src="https://picsum.photos/id/1045/800/600.jpg"
              srcset="
                https://picsum.photos/id/1045/800/600.jpg   800w,
                https://picsum.photos/id/1045/1200/900.jpg 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
              alt="Temple silhouette framed by trees at dusk"
              loading="lazy"
            />
          </picture>
          <figcaption>Temple silhouette at dusk</figcaption>
        </figure>

        <figure>
          <picture>
            <source
              type="image/webp"
              srcset="
                https://picsum.photos/id/1055/800/600.webp   800w,
                https://picsum.photos/id/1055/1200/900.webp 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
            />
            <img
              src="https://picsum.photos/id/1055/800/600.jpg"
              srcset="
                https://picsum.photos/id/1055/800/600.jpg   800w,
                https://picsum.photos/id/1055/1200/900.jpg 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
              alt="Stone carvings on a temple wall"
              loading="lazy"
            />
          </picture>
          <figcaption>Stone carvings</figcaption>
        </figure>

        <figure>
          <picture>
            <source
              type="image/webp"
              srcset="
                https://picsum.photos/id/1065/800/600.webp   800w,
                https://picsum.photos/id/1065/1200/900.webp 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
            />
            <img
              src="https://picsum.photos/id/1065/800/600.jpg"
              srcset="
                https://picsum.photos/id/1065/800/600.jpg   800w,
                https://picsum.photos/id/1065/1200/900.jpg 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
              alt="Temple reflection in calm water"
              loading="lazy"
            />
          </picture>
          <figcaption>Temple reflection</figcaption>
        </figure>

        <figure>
          <picture>
            <source
              type="image/webp"
              srcset="
                https://picsum.photos/seed/temple-door/800/600.webp   800w,
                https://picsum.photos/seed/temple-door/1200/900.webp 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
            />
            <img
              src="https://picsum.photos/seed/temple-door/800/600.jpg"
              srcset="
                https://picsum.photos/seed/temple-door/800/600.jpg   800w,
                https://picsum.photos/seed/temple-door/1200/900.jpg 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
              alt="Close-up of temple doorway with lanterns"
              loading="lazy"
            />
          </picture>
          <figcaption>Temple doorway</figcaption>
        </figure>

        <figure>
          <picture>
            <source
              type="image/webp"
              srcset="
                https://picsum.photos/seed/hilltop/800/600.webp   800w,
                https://picsum.photos/seed/hilltop/1200/900.webp 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
            />
            <img
              src="https://picsum.photos/seed/hilltop/800/600.jpg"
              srcset="
                https://picsum.photos/seed/hilltop/800/600.jpg   800w,
                https://picsum.photos/seed/hilltop/1200/900.jpg 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
              alt="Visitors ascending steps to a hilltop temple"
              loading="lazy"
            />
          </picture>
          <figcaption>Hilltop temple</figcaption>
        </figure>

        <figure>
          <picture>
            <source
              type="image/webp"
              srcset="
                https://picsum.photos/seed/temple-night/800/600.webp   800w,
                https://picsum.photos/seed/temple-night/1200/900.webp 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
            />
            <img
              src="https://picsum.photos/seed/temple-night/800/600.jpg"
              srcset="
                https://picsum.photos/seed/temple-night/800/600.jpg   800w,
                https://picsum.photos/seed/temple-night/1200/900.jpg 1200w
              "
              sizes="(min-width:900px) 33vw, 100vw"
              alt="Night view of a temple lit by warm lights"
              loading="lazy"
            />
          </picture>
          <figcaption>Temple at night</figcaption>
        </figure>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-columns">
          <p>&copy; <span id="year">2026</span> Uwase Jolie | Uganda</p>
          <p>Last Modified: <span id="lastModified">—</span></p>
        </div>
      </div>
    </footer>

    <script src="scripts/temples.js" defer></script>
  </body>
</html>
