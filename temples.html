<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Album | WDD 131</title>
  <meta
    name="description"
    content="A responsive WDD 131 temple album page with real temple images, a mobile hamburger menu, and dynamic footer dates."
  >
  <meta name="author" content="Uwase Jolie">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="styles/temples.css">
  <link rel="stylesheet" href="styles/temples-large.css">
  <script defer src="scripts/temples.js"></script>
</head>
<body>
  <header>
    <div class="header-wrapper">
      <span class="site-title">Temple Album</span>
      <button id="menu" type="button" aria-label="Open navigation" aria-expanded="false"></button>
      <nav id="navigation">
        <a href="#">Home</a>
        <a href="#">Old</a>
        <a href="#">New</a>
        <a href="#">Large</a>
        <a href="#">Small</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Temple Album</h1>
    <div class="album">
      <figure>
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Salt_Lake_Temple_UT1.jpg?width=400"
          alt="Salt Lake Temple"
          width="400"
          height="600"
        >
        <figcaption>Salt Lake Temple</figcaption>
      </figure>
      <figure>
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Manti_Utah_Temple.jpg?width=400"
          alt="Manti Utah Temple"
          width="400"
          height="266"
          loading="lazy"
        >
        <figcaption>Manti Utah Temple</figcaption>
      </figure>
      <figure>
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Logan_Utah_Temple.jpg?width=400"
          alt="Logan Utah Temple"
          width="400"
          height="267"
          loading="lazy"
        >
        <figcaption>Logan Utah Temple</figcaption>
      </figure>
      <figure>
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Oakland_Mormon_Temple.jpg?width=400"
          alt="Oakland California Temple"
          width="400"
          height="300"
          loading="lazy"
        >
        <figcaption>Oakland California Temple</figcaption>
      </figure>
      <figure>
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Washington_D.C._Temple_At_Dusk.jpg?width=400"
          alt="Washington D.C. Temple"
          width="400"
          height="267"
          loading="lazy"
        >
        <figcaption>Washington D.C. Temple</figcaption>
      </figure>
      <figure>
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Temple_Laie.jpg?width=400"
          alt="Laie Hawaii Temple"
          width="400"
          height="276"
          loading="lazy"
        >
        <figcaption>Laie Hawaii Temple</figcaption>
      </figure>
      <figure>
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Ghana_Mission_247.jpg?width=400"
          alt="Accra Ghana Temple"
          width="400"
          height="300"
          loading="lazy"
        >
        <figcaption>Accra Ghana Temple</figcaption>
      </figure>
      <figure>
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/San_Diego_California_Temple.jpg?width=400"
          alt="San Diego California Temple"
          width="400"
          height="267"
          loading="lazy"
        >
        <figcaption>San Diego California Temple</figcaption>
      </figure>
      <figure>
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/RomeTempleatSunset.jpg?width=400"
          alt="Rome Italy Temple"
          width="400"
          height="267"
          loading="lazy"
        >
        <figcaption>Rome Italy Temple</figcaption>
      </figure>
    </div>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> Uwase Jolie. UGANDA.</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>

</html>
